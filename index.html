<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pine Stays Calendar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --background-start-rgb: 243 245 248;
        --background-end-rgb: 237 239 243;
        --foreground: 220 25% 15%;
        --card: 220 40% 98.5%;
        --card-foreground: 220 25% 15%;
        --popover: 220 40% 98.5%;
        --popover-foreground: 220 25% 15%;
        --primary: 220 70% 55%;
        --primary-foreground: 0 0% 100%;
        --secondary: 220 20% 90%;
        --secondary-foreground: 220 25% 25%;
        --muted: 220 20% 94%;
        --muted-foreground: 220 15% 45%;
        --accent: 220 20% 92%;
        --accent-foreground: 220 25% 20%;
        --destructive: 358 75% 55%;
        --destructive-foreground: 0 0% 100%;
        --border: 220 20% 85%;
        --input: 220 20% 92%;
        --ring: 220 70% 55%;
        --radius: 0.75rem;
      }
      .dark {
        --background-start-rgb: 20 24 31;
        --background-end-rgb: 31 36 46;
        --foreground: 220 20% 90%;
        --card: 220 30% 20%;
        --card-foreground: 220 20% 90%;
        --popover: 220 30% 10%;
        --popover-foreground: 220 20% 90%;
        --primary: 220 80% 70%;
        --primary-foreground: 220 30% 10%;
        --secondary: 220 20% 25%;
        --secondary-foreground: 220 20% 85%;
        --muted: 220 20% 22%;
        --muted-foreground: 220 15% 65%;
        --accent: 220 20% 25%;
        --accent-foreground: 220 20% 90%;
        --destructive: 0 63% 55%;
        --destructive-foreground: 0 0% 100%;
        --border: 220 20% 30%;
        --input: 220 20% 28%;
        --ring: 220 80% 70%;
      }

      body {
        background-color: rgb(var(--background-start-rgb));
        background-image: linear-gradient(to bottom right, rgb(var(--background-start-rgb)), rgb(var(--background-end-rgb)));
        color: hsl(var(--foreground));
        font-family: 'Inter', sans-serif;
      }
      
      /* Fix iOS input zoom issue */
      input,
      textarea,
      select {
        font-size: 16px !important;
      }
      
      .glass-ui {
        background-color: hsla(var(--card), 0.6) !important;
        backdrop-filter: blur(24px) saturate(180%);
        border: 1px solid hsla(var(--border), 0.5) !important;
      }
      
      .dark .glass-ui {
        background-color: hsla(var(--card), 0.4) !important;
        border: 1px solid hsla(var(--border), 0.3) !important;
      }

      /* Custom scrollbar */
      .custom-scrollbar::-webkit-scrollbar {
        height: 8px;
        width: 8px;
        background-color: hsl(var(--muted) / 0.5);
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background-color: hsl(var(--secondary-foreground) / 0.4);
        border-radius: 10px;
        border: 2px solid transparent;
        background-clip: content-box;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background-color: hsl(var(--secondary-foreground) / 0.6);
      }

      /* Custom styles for native date picker to ensure visibility across themes */
      input[type="date"] { color-scheme: light; }
      .dark input[type="date"] { color-scheme: dark; }
      .dark input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1); }
    </style>
     <script>
      // Prevents flash of unstyled content (FOUC) for dark mode
      (function() {
        const theme = localStorage.getItem('pine_stays_theme') || 'system';
        if (theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
            fontSize: {
              base: '16px', // Ensure base font size is 16px
            },
            colors: {
              border: 'hsl(var(--border))',
              input: 'hsl(var(--input))',
              ring: 'hsl(var(--ring))',
              background: 'hsl(var(--background))',
              foreground: 'hsl(var(--foreground))',
              primary: {
                DEFAULT: 'hsl(var(--primary))',
                foreground: 'hsl(var(--primary-foreground))',
              },
              secondary: {
                DEFAULT: 'hsl(var(--secondary))',
                foreground: 'hsl(var(--secondary-foreground))',
              },
              destructive: {
                DEFAULT: 'hsl(var(--destructive))',
                foreground: 'hsl(var(--destructive-foreground))',
              },
              muted: {
                DEFAULT: 'hsl(var(--muted))',
                foreground: 'hsl(var(--muted-foreground))',
              },
              accent: {
                DEFAULT: 'hsl(var(--accent))',
                foreground: 'hsl(var(--accent-foreground))',
              },
              popover: {
                DEFAULT: 'hsl(var(--popover))',
                foreground: 'hsl(var(--popover-foreground))',
              },
              card: {
                DEFAULT: 'hsl(var(--card))',
                foreground: 'hsl(var(--card-foreground))',
              },
            },
            animation: {
              'fade-in': 'fadeIn 0.3s ease-out forwards',
              'slide-in-from-left': 'slideInFromLeft 0.3s ease-out forwards',
              'slide-out-to-left': 'slideOutToLeft 0.3s ease-in forwards',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: 0, transform: 'scale(0.98)' },
                '100%': { opacity: 1, transform: 'scale(1)' },
              },
              slideInFromLeft: {
                '0%': { transform: 'translateX(-100%)' },
                '100%': { transform: 'translateX(0)' },
              },
              slideOutToLeft: {
                '0%': { transform: 'translateX(0)' },
                '100%': { transform: 'translateX(-100%)' },
              }
            }
          },
        },
      }
    </script>
  <script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react-router-dom": "https://aistudiocdn.com/react-router-dom@^6.24.0",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^0.14.0",
    "firebase/": "https://aistudiocdn.com/firebase@^12.5.0/",
    "@firebase/firestore-types": "https://aistudiocdn.com/@firebase/firestore-types@^3.0.3"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
